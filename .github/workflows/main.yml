name: Gerar APK e AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'
          cache: true

      - name: Criar estrutura Android se não existir
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org br.com.vigilanterecibos --project-name vigilante_recibos .
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          arquivo = Path("android/settings.gradle")
          texto = arquivo.read_text()
          texto, quantidade = re.subn(
              r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.0.0\2',
              texto
          )
          if quantidade == 0:
              raise SystemExit("Não encontrei a configuração do Kotlin")
          arquivo.write_text(texto)
          PY        
        
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.gemalto.jp2.**
          -dontwarn com.tom_roush.pdfbox.filter.JPXFilter
          EOF
          python3 - <<'PY'
          from pathlib import Path
          arquivo = Path("android/app/build.gradle.kts")
          texto = arquivo.read_text()
          alvo = 'signingConfig = signingConfigs.getByName("debug")'
          if "proguard-rules.pro" not in texto:
              if alvo not in texto:
                  raise SystemExit("Não encontrei a configuração release esperada do Flutter.")
              texto = texto.replace(
                  alvo,
                  alvo + '\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                  1,
              )
              arquivo.write_text(texto)
          PY

      - name: Limpar projeto
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Manter assinatura debug entre builds de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vigilante-recibos-debug-keystore-v1

      - name: Gerar APK
        run: flutter build apk --debug

      - name: Gerar AAB
        run: flutter build appbundle --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
        

