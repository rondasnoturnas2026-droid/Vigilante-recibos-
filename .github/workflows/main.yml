name: Gerar APK e AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integrar-ronda-compartilhamento
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Criar estrutura Android se não existir
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org br.com.vigilanterecibos --project-name vigilante_recibos .
          fi
          python3 - <<'PY'
          from pathlib import Path

          arquivos = list(Path("android/app/src/main").rglob("MainActivity.kt"))
          if len(arquivos) != 1:
              raise SystemExit(
                  f"Esperava encontrar exatamente um MainActivity.kt; encontrei {len(arquivos)}"
              )

          arquivo = arquivos[0]
          texto = arquivo.read_text(encoding="utf-8")

          if "FlutterFragmentActivity" not in texto:
              if "FlutterActivity" not in texto:
                  raise SystemExit("Não encontrei a classe FlutterActivity esperada.")
              texto = texto.replace("FlutterActivity", "FlutterFragmentActivity")
              arquivo.write_text(texto, encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          arquivo = Path("android/settings.gradle.kts")
          texto = arquivo.read_text()
          texto, quantidade = re.subn(
              r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.2.20\2',
              texto
          )
          if quantidade == 0:
              raise SystemExit("Não encontrei a configuração do Kotlin")
          arquivo.write_text(texto)
          PY
        
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.gemalto.jp2.**
          -dontwarn com.tom_roush.pdfbox.filter.JPXFilter
          EOF
          python3 - <<'PY'
          from pathlib import Path
          arquivo = Path("android/app/build.gradle.kts")
          texto = arquivo.read_text()
          alvo = 'signingConfig = signingConfigs.getByName("debug")'
          if "proguard-rules.pro" not in texto:
              if alvo not in texto:
                  raise SystemExit("Não encontrei a configuração release esperada do Flutter.")
              texto = texto.replace(
                  alvo,
                  alvo + '\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                  1,
              )
              arquivo.write_text(texto)
          PY
      - name: Adicionar permissões de localização
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifesto = Path("android/app/src/main/AndroidManifest.xml")
          texto = manifesto.read_text(encoding="utf-8")

          permissoes = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
                            "android.permission.ACCESS_BACKGROUND_LOCATION",
          ]
          faltantes = [
              nome for nome in permissoes
              if f'android:name="{nome}"' not in texto
          ]

          if faltantes:
              aplicacao = re.search(r"(?m)^([ \t]*)<application\b", texto)
              if aplicacao is None:
                  raise SystemExit(
                      "Não encontrei <application> no AndroidManifest.xml."
                  )
              recuo = aplicacao.group(1)
              bloco = "\n".join(
                  f'{recuo}<uses-permission android:name="{nome}" />'
                  for nome in faltantes
              )
              texto = (
                  texto[:aplicacao.start()]
                  + bloco
                  + "\n"
                  + texto[aplicacao.start():]
              )
              manifesto.write_text(texto, encoding="utf-8")
          PY
      - name: Preparar recebimento de roteiro JSON
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          atividades = list(Path("android/app/src/main").rglob("MainActivity.kt"))
          if len(atividades) != 1:
              raise SystemExit("Não encontrei exatamente um MainActivity.kt.")

          arquivo = atividades[0]
          linhas = arquivo.read_text(encoding="utf-8").splitlines()
          pacote = next((linha for linha in linhas if linha.startswith("package ")), None)
          if pacote is None:
              raise SystemExit("Não encontrei o pacote da MainActivity.")

          codigo = """
          import android.content.Intent
          import android.net.Uri
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterFragmentActivity() {
              private val nomeCanal = "br.com.vigilanterecibos/rota_compartilhada"
              private var roteiroPendente: String? = null
              private var canalFlutter: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  canalFlutter = MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      nomeCanal
                  )
                  canalFlutter?.setMethodCallHandler { chamada, resposta ->
                      if (chamada.method == "getPendingRoute") {
                          resposta.success(roteiroPendente)
                          roteiroPendente = null
                      } else {
                          resposta.notImplemented()
                      }
                  }
                  receberRoteiro(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  receberRoteiro(intent)
              }

              private fun receberRoteiro(intent: Intent?) {
                  if (intent == null) return

                  @Suppress("DEPRECATION")
                  val uri: Uri? = when (intent.action) {
                      Intent.ACTION_VIEW -> intent.data
                      Intent.ACTION_SEND ->
                          intent.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)
                              ?: intent.data
                      else -> null
                  } ?: intent.clipData?.getItemAt(0)?.uri

                  if (uri == null ||
                      !uri.lastPathSegment.orEmpty().endsWith(".json", ignoreCase = true)
                  ) return

                  try {
                      val conteudo = contentResolver.openInputStream(uri)
                          ?.bufferedReader(Charsets.UTF_8)
                          ?.use { it.readText() }
                          ?: return
                      roteiroPendente = conteudo
                      canalFlutter?.invokeMethod("sharedRouteReceived", conteudo)
                  } catch (_: Exception) {
                      // O app mostrará a mensagem de erro ao tentar importar.
                  }
              }
          }
          """
          arquivo.write_text(pacote + "\n\n" + codigo, encoding="utf-8")

          manifesto = Path("android/app/src/main/AndroidManifest.xml")
          texto = manifesto.read_text(encoding="utf-8")
          padrao = re.compile(
              r'(?s)(^[ \t]*<activity\b(?=[^>]*android:name="[^"]*MainActivity")[^>]*>)(.*?)(^[ \t]*</activity>)',
              re.MULTILINE,
          )
          atividade = padrao.search(texto)
          if atividade is None:
              raise SystemExit("Não encontrei a atividade MainActivity no manifesto.")

          abertura = atividade.group(1)
          if "android:launchMode=" not in abertura:
              nova_abertura = abertura[:-1] + ' android:launchMode="singleTop">'
              texto = texto[:atividade.start(1)] + nova_abertura + texto[atividade.end(1):]
              atividade = padrao.search(texto)

          marcador = "<!-- recebimento de roteiro JSON -->"
          if marcador not in atividade.group(2):
              filtros = """
                      <!-- recebimento de roteiro JSON -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="content" android:mimeType="application/json" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/json" />
                      </intent-filter>
              """
              texto = texto[:atividade.start(3)] + filtros + "\n" + texto[atividade.start(3):]

          manifesto.write_text(texto, encoding="utf-8")
          PY
      - name: Limpar projeto
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get
      - name: Gerar ícone do aplicativo
        run: dart run flutter_launcher_icons
      - name: Manter assinatura debug entre builds de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vigilante-recibos-debug-keystore-v1

      - name: Gerar APK
        run: flutter build apk --debug

      - name: Gerar AAB
        run: flutter build appbundle --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
        

