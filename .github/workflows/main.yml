name: Gerar APK e AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - teste/ronda-guiada
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'
          cache: true

      - name: Criar estrutura Android se não existir
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org br.com.vigilanterecibos --project-name vigilante_recibos .
          fi
          python3 - <<'PY'
          from pathlib import Path

          arquivos = list(Path("android/app/src/main").rglob("MainActivity.kt"))
          if len(arquivos) != 1:
              raise SystemExit(
                  f"Esperava encontrar exatamente um MainActivity.kt; encontrei {len(arquivos)}"
              )

          arquivo = arquivos[0]
          texto = arquivo.read_text(encoding="utf-8")

          if "FlutterFragmentActivity" not in texto:
              if "FlutterActivity" not in texto:
                  raise SystemExit("Não encontrei a classe FlutterActivity esperada.")
              texto = texto.replace("FlutterActivity", "FlutterFragmentActivity")
              arquivo.write_text(texto, encoding="utf-8")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          arquivo = Path("android/settings.gradle.kts")
          texto = arquivo.read_text()
          texto, quantidade = re.subn(
              r'(id\s*\(?\s*["\']org\.jetbrains\.kotlin\.android["\']\s*\)?\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.2.0\2',
              texto
          )
          if quantidade == 0:
              raise SystemExit("Não encontrei a configuração do Kotlin")
          arquivo.write_text(texto)
          PY
        
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.gemalto.jp2.**
          -dontwarn com.tom_roush.pdfbox.filter.JPXFilter
          EOF
          python3 - <<'PY'
          from pathlib import Path
          arquivo = Path("android/app/build.gradle.kts")
          texto = arquivo.read_text()
          alvo = 'signingConfig = signingConfigs.getByName("debug")'
          if "proguard-rules.pro" not in texto:
              if alvo not in texto:
                  raise SystemExit("Não encontrei a configuração release esperada do Flutter.")
              texto = texto.replace(
                  alvo,
                  alvo + '\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                  1,
              )
              arquivo.write_text(texto)
          PY
             - name: Adicionar permissões de ronda e botão flutuante
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifesto = Path("android/app/src/main/AndroidManifest.xml")
          texto = manifesto.read_text(encoding="utf-8")

          permissoes = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.CAMERA",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SYSTEM_ALERT_WINDOW",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_CAMERA",
              "android.permission.FOREGROUND_SERVICE_SPECIAL_USE",
          ]

          faltantes = [
              nome for nome in permissoes
              if f'android:name="{nome}"' not in texto
          ]

          aplicacao = re.search(r"(?m)^([ \t]*)<application\b", texto)
          if aplicacao is None:
              raise SystemExit(
                  "Não encontrei <application> no AndroidManifest.xml."
              )

          if faltantes:
              recuo = aplicacao.group(1)
              bloco = "\n".join(
                  f'{recuo}<uses-permission android:name="{nome}" />'
                  for nome in faltantes
              )
              texto = (
                  texto[:aplicacao.start()]
                  + bloco
                  + "\n"
                  + texto[aplicacao.start():]
              )

          nome_servico = (
              "flutter.overlay.window.flutter_overlay_window.OverlayService"
          )

          if nome_servico not in texto:
              aplicacao_fechamento = re.search(
                  r"(?m)^([ \t]*)</application>",
                  texto,
              )
              if aplicacao_fechamento is None:
                  raise SystemExit(
                      "Não encontrei </application> no AndroidManifest.xml."
                  )

              recuo = aplicacao_fechamento.group(1) + "    "
              servico = (
                  f'{recuo}<service\n'
                  f'{recuo}    android:name="{nome_servico}"\n'
                  f'{recuo}    android:exported="false"\n'
                  f'{recuo}    android:foregroundServiceType="specialUse">\n'
                  f'{recuo}    <property\n'
                  f'{recuo}        android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n'
                  f'{recuo}        android:value="Floating control for an active security patrol" />\n'
                  f'{recuo}</service>\n'
              )

              texto = (
                  texto[:aplicacao_fechamento.start()]
                  + servico
                  + texto[aplicacao_fechamento.start():]
              )

          manifesto.write_text(texto, encoding="utf-8")
          PY
      - name: Limpar projeto
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get
      - name: Gerar ícone do aplicativo
        run: dart run flutter_launcher_icons
      - name: Manter assinatura debug entre builds de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vigilante-recibos-debug-keystore-v1

      - name: Gerar APK
        run: flutter build apk --debug

      - name: Gerar AAB
        run: flutter build appbundle --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Salvar AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
        

